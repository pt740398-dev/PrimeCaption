
name: Prime Captions APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Prime Captions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Locate or Extract Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find . -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path './.git/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . -type f -name '*.zip' \
              -not -path './.git/*' | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Gradle project or ZIP found."
              find . -maxdepth 4 -type f | head -200
              exit 1
            fi

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            PROJECT_DIR=$(find extracted -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found after extraction."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Found project: $PROJECT_DIR"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/${PROJECT_DIR#./}" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-Captions-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
