
name: Prime Captions APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP
        shell: bash
        run: |
          ZIP_FILE="Prime_Captions_Android_Project_0_4_EDITOR.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Project ZIP found."

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/prime-captions"

          unzip -q \
            Prime_Captions_Android_Project_0_4_EDITOR.zip \
            -d "$RUNNER_TEMP/prime-captions"

          PROJECT_DIR="$RUNNER_TEMP/prime-captions"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts missing!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Prime Captions APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK missing or empty!"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload Prime Captions APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-Captions-APK
          path: ${{ runner.temp }}/prime-captions/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
