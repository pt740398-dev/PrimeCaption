
name: Prime Captions APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP
        shell: bash
        run: |
          ZIP_FILE="Prime_Captions_Android_Project_0_3_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Files available:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found project archive: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/prime-captions"

          unzip -q \
            "Prime_Captions_Android_Project_0_3_FIXED.zip" \
            -d "$RUNNER_TEMP/prime-captions"

          PROJECT_DIR="$RUNNER_TEMP/prime-captions"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts missing after extraction."
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project structure verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Build Prime Captions APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace --console=plain assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Prime Captions APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-Captions-APK
          path: ${{ runner.temp }}/prime-captions/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
